        <h1>FaZe Blackbox — Unlock the Past. Build the Next Generation.</h1>
        <p><strong>The problem:</strong> FaZe Clan has longtime fans who lived its history and a new generation just discovering it — but nothing puts those two groups on the same team.</p>
        <p><strong>The game:</strong> a cooperative two-player mystery vault. One player is the Legacy Agent, a longtime fan who sees a dated historical archive. The other is the New Recruit, a new fan who holds the puzzle and the only keypad. Neither can solve a stage alone — each needs information from the other. Three stages, built only from the sponsor-provided FaZe Clan timeline, 2010–2026. Solo practice lets one player switch roles and see both sides.</p>
        <p><strong>Repeat play:</strong> a Daily Match Point strategy game, five-question Sports Quick Play rounds, and a free Saturday Challenge every week — each with a Challenge a Friend link so one player brings the next one in.</p>
        <p><strong>Proposed revenue:</strong> daily play stays free. A proposed $4.99 one-time Creator Challenge Pack and a flat-fee Saturday Challenge sponsorship. No sponsors, no sales and no revenue yet — everything sponsor-related is a proposal, and the cash-prize preview is an example only.</p>
        <p>This is an independent student project for HackUTA 2026, not an official FaZe Clan product. JavaScript is required to play the game — please enable it and reload.</p>
        <p><a href="https://github.com/Sukhman-Singh007/Faze-Blackbox">GitHub repository</a></p>
      </main>
